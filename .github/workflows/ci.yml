name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keeps CI honest about Node 22 (see .nvmrc and package.json engines).
  NODE_VERSION: '22'

jobs:
  verify:
    name: lint · boundaries · build · test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Version comes from the `packageManager` field in package.json, so the
      # workflow cannot drift from what developers run locally.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Architecture fitness function, addendum §19. Runs before the build on
      # purpose: a boundary break is a design defect, and finding it should not
      # depend on the code also compiling.
      - name: Boundaries
        run: pnpm boundaries

      # Both apps build regardless of the ADR-0001 runtime verdict — that is the
      # fitness function keeping the deployment choice reversible
      # (docs/engineering/repo-map.md, addendum §22).
      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:unit

      # Testcontainers drives the docker daemon that ubuntu-latest ships with; no
      # service container or extra setup is required.
      - name: Integration tests
        run: pnpm test:integration
