name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Least privilege. CI reads the tree and nothing else — it does not comment,
# label, publish, or write back. Any job that later needs more asks for it at the
# job level, not here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keeps CI honest about Node 22 (see .nvmrc and package.json engines).
  NODE_VERSION: '22'

jobs:
  verify:
    name: lint · boundaries · build · test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Version comes from the `packageManager` field in package.json, so the
      # workflow cannot drift from what developers run locally.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Architecture fitness function, addendum §19. Runs before the build on
      # purpose: a boundary break is a design defect, and finding it should not
      # depend on the code also compiling.
      - name: Boundaries
        run: pnpm boundaries

      - name: build:web
        run: pnpm build:web

      # One server build, because there is one deployment target: the Node bundle
      # Render runs (ADR-0009). The `workerd` build this step used to be paired
      # with is deleted — with the runtime decided, a second bundle nobody deploys
      # proves nothing. Portability is enforced by the Boundaries step above, not
      # by compiling for a host we will not use.
      - name: build:server:node
        run: pnpm build:server:node

      - name: Unit tests
        run: pnpm test:unit

      # Testcontainers drives the docker daemon that ubuntu-latest ships with; no
      # service container or extra setup is required. DEBUG makes the container
      # lifecycle visible in the log, so "a real Postgres booted" is something a
      # reader can verify rather than take on trust.
      - name: Integration tests
        run: pnpm test:integration
        env:
          DEBUG: testcontainers*

      # ADR-0002's bypass suite. A separate step from the integration tests on
      # purpose: this one is the compensating control for a database that will
      # never catch a missing `WHERE viewer_id`, so it must be visible as its own
      # red/green signal and never disappear into "the slow tests". It also gates
      # the B-row manifest — all eighteen rows are reported with their state, and
      # a row that vanishes fails the job.
      - name: Security tests
        run: pnpm test:security
        env:
          DEBUG: testcontainers*
