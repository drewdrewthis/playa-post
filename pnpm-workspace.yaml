packages:
  - apps/*
  - packages/*

# pnpm blocks dependency build scripts by default. Only these are allowed to run.
# The `false` entries are optional native accelerators pulled in transitively by
# testcontainers; the library works without them and skipping them keeps CI fast.
allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@supabase/auth-js@2.112.2'
  - '@supabase/functions-js@2.112.2'
  - '@supabase/postgrest-js@2.112.2'
  - '@supabase/realtime-js@2.112.2'
  - '@supabase/storage-js@2.112.2'
  - '@supabase/supabase-js@2.112.2'
