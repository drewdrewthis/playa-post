<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#120a1a" />
    <meta
      name="description"
      content="Playa Post — a private, opt-in community trust network."
    />
    <title>Playa Post</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!--
      Stamps the resolved theme before the first paint.

      This runs inline, render-blocking, and duplicated from
      `src/app/theme/theme-preference.ts` on purpose: a module import resolves *after*
      the browser has already painted, so a user whose resolved theme isn't the default
      would see one frame of the wrong palette on every load. That flash is the whole
      reason this exists. The three-way preference (light/dark/system, issue #151) and
      the two `theme-color` values must be changed together — `theme-preference.ts`
      says so from its side too.
    -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('playapost-theme');
          if (stored === 'dark' || stored === 'light') {
            theme = stored;
          } else if (stored === 'system') {
            theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          // Anything else — nothing stored, or garbage — keeps the dark default.
        } catch (error) {
          /* Storage unavailable — fall through to the dark default. */
        }
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#120a1a' : '#f6efe2');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry.tsx"></script>
  </body>
</html>
