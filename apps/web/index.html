<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6efe2" />
    <meta
      name="description"
      content="Playa Post — a private, opt-in community trust network."
    />
    <title>Playa Post</title>
    <!--
      Stamps the persisted theme before the first paint.

      This runs inline, render-blocking, and duplicated from
      `src/app/theme/theme-preference.ts` on purpose: a module import resolves *after*
      the browser has already painted, so a dark-theme user would see one frame of the
      light palette on every load. That flash is the whole reason this exists. The two
      copies of the storage key and the two `theme-color` values must be changed
      together — `theme-preference.ts` says so from its side too.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('playapost-theme');
          if (stored === 'dark' || stored === 'light') {
            document.documentElement.dataset.theme = stored;
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', stored === 'dark' ? '#120a1a' : '#f6efe2');
            return;
          }
        } catch (error) {
          /* Storage unavailable — fall through to the light default. */
        }
        document.documentElement.dataset.theme = 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry.tsx"></script>
  </body>
</html>
